[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cpc-electrometer-calibration"
version = "0.1.0"
description = "CPC calibration workflow using electrometer reference measurements."
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "scipy",
]

